<title>카페 울공 키오스크</title>
<style>
  /* This page renders a single, fixed device screen — like a real kiosk,
     it does not follow the viewer's OS light/dark setting. Colors are
     declared once and used everywhere via tokens. */

  @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap');

  :root {
    --ink: #2b2420;
    --ink-soft: #6e645b;
    --ink-faint: #a89e93;
    --paper: #ffffff;
    --paper-tint: #f7f3ec;
    --stage: #ece6dc;
    --line: #e6ded2;
    --gold: #c8912e;
    --gold-soft: #f1e2c4;
    --sage: #4f8272;
    --plum: #82628a;
    --toast: #9c6f45;
    --cta: #2f6b54;
    --cta-hover: #24543f;
    --danger: #b23b3b;
    --shadow: rgba(43, 36, 32, 0.16);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 10px;
    font-size: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--stage);
    color: var(--ink);
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .display {
    font-family: 'Do Hyeon', 'Malgun Gothic', sans-serif;
    font-weight: 400;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .num {
    font-variant-numeric: tabular-nums;
  }

  /* ---------- stage ---------- */

  #kiosk-root, #phone-root {
    display: none;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(14px, 3vw, 40px);
  }

  .kiosk {
    position: relative;
    width: 100%;
    max-width: 1180px;
    background: var(--paper);
    border-radius: var(--radius-lg);
    box-shadow: 0 30px 60px var(--shadow), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: min(800px, calc(100vh - 40px));
  }

  /* ---------- header ---------- */

  .kiosk__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 28px;
    background: var(--ink);
    color: var(--paper);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand__mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--gold);
    display: grid;
    place-items: center;
    color: var(--ink);
    flex-shrink: 0;
  }

  .brand__mark svg { width: 26px; height: 26px; }

  .brand__text .display {
    font-size: 1.5rem;
    line-height: 1;
  }

  .brand__text p {
    margin: 4px 0 0;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.65);
  }

  .order-type {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.1);
    padding: 5px;
    border-radius: 999px;
  }

  .order-type button {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.7);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, color 0.15s;
  }

  .order-type button svg { width: 16px; height: 16px; }

  .order-type button.is-active {
    background: var(--gold);
    color: var(--ink);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .help-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    transition: background 0.15s, color 0.15s;
  }

  .help-btn:hover { background: rgba(255,255,255,0.2); color: var(--paper); }
  .help-btn svg { width: 16px; height: 16px; }

  .help-toast {
    position: absolute;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%) translateY(16px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    box-shadow: 0 14px 30px var(--shadow);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 35;
    white-space: nowrap;
  }

  .help-toast svg { width: 16px; height: 16px; color: var(--gold); flex-shrink: 0; }

  .help-toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- body layout ---------- */

  .kiosk__body {
    flex: 1;
    display: grid;
    grid-template-columns: 168px 1fr 336px;
    grid-template-rows: minmax(0, 1fr);
    min-height: 0;
  }

  /* ---------- category rail ---------- */

  .categories {
    background: var(--paper-tint);
    border-right: 1px solid var(--line);
    padding: 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    min-height: 0;
  }

  .cat-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px;
    border-radius: var(--radius-sm);
    text-align: left;
    font-size: 0.95rem;
    transition: background 0.15s, color 0.15s;
  }

  .cat-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .cat-btn:hover { background: var(--stage); }

  .cat-btn.is-active {
    background: var(--ink);
    color: var(--paper);
  }

  /* ---------- menu grid ---------- */

  .menu {
    padding: 22px 24px 32px;
    overflow-y: auto;
    min-height: 0;
  }

  .menu__heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .menu__heading h2 {
    margin: 0;
    font-size: 1.3rem;
  }

  .menu__heading span {
    color: var(--ink-faint);
    font-size: 0.85rem;
  }

  .menu__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(208px, 1fr));
    gap: 16px;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--paper);
    transition: box-shadow 0.15s, transform 0.15s;
  }

  .card:hover {
    box-shadow: 0 8px 20px var(--shadow);
    transform: translateY(-2px);
  }

  .card__top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .card__icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .card__icon svg { width: 26px; height: 26px; }

  .temp-tag {
    font-size: 0.72rem;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .temp-toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  .temp-toggle button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 0.72rem;
    padding: 5px 10px;
    transition: background 0.15s, color 0.15s;
  }

  .temp-toggle button.is-active {
    background: var(--ink);
    color: var(--paper);
  }

  .card__name {
    font-size: 1.08rem;
    line-height: 1.3;
  }

  .card__price {
    font-weight: 400;
    font-size: 1.02rem;
  }

  .options-toggle {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 0.78rem;
    text-align: left;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: var(--line);
  }

  .options-toggle:hover { color: var(--ink); }

  .options-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    background: var(--paper-tint);
    border-radius: var(--radius-sm);
  }

  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .option-row__label {
    font-size: 0.82rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .option-row .temp-toggle button { white-space: nowrap; }

  .decaf-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
  }

  .decaf-chip input {
    width: 16px;
    height: 16px;
    accent-color: var(--ink);
  }

  .card__bottom {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stepper button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper-tint);
    color: var(--ink);
    font-size: 1rem;
    line-height: 1;
    display: grid;
    place-items: center;
  }

  .stepper button:hover { background: var(--stage); }

  .stepper__count {
    min-width: 18px;
    text-align: center;
    font-size: 0.95rem;
  }

  .add-btn {
    border: none;
    background: var(--ink);
    color: var(--paper);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.88rem;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
  }

  .add-btn:hover { background: #47392f; }

  .add-btn.is-added {
    background: var(--cta);
  }

  /* ---------- cart panel ---------- */

  .cart {
    background: var(--paper-tint);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .cart__summary-bar {
    display: none;
  }

  .cart__head {
    padding: 18px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cart__head h2 {
    margin: 0;
    font-size: 1.1rem;
  }

  .cart__head span {
    font-size: 0.8rem;
    color: var(--ink-faint);
  }

  .cart__list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cart__empty {
    margin: auto;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.92rem;
    padding: 20px;
  }

  .cart__empty svg {
    width: 40px;
    height: 40px;
    margin-bottom: 8px;
    color: var(--ink-faint);
  }

  .line {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .line__top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .line__name {
    font-size: 0.95rem;
    line-height: 1.25;
  }

  .line__meta {
    font-size: 0.76rem;
    color: var(--ink-faint);
  }

  .line__remove {
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 1.1rem;
    line-height: 1;
    padding: 2px 4px;
  }

  .line__remove:hover { color: var(--danger); }

  .line__bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .line .stepper button { width: 26px; height: 26px; }

  .line__price {
    font-size: 0.92rem;
  }

  .cart__foot {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .cart__total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .cart__total-row span:first-child {
    font-size: 0.95rem;
    color: var(--ink-soft);
  }

  .cart__total-row span:last-child {
    font-size: 1.5rem;
  }

  .cart__receipt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .cart__receipt-row .temp-toggle button { padding: 5px 12px; }

  .pay-btn {
    border: none;
    background: var(--cta);
    color: var(--paper);
    padding: 15px;
    border-radius: var(--radius-sm);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .pay-btn:hover:not(:disabled) { background: var(--cta-hover); }

  .pay-btn:disabled {
    background: var(--ink-faint);
    cursor: not-allowed;
  }

  .pay-btn svg { width: 20px; height: 20px; }

  /* ---------- modal ---------- */

  .modal-veil {
    position: fixed;
    inset: 0;
    background: rgba(43,36,32,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 40;
  }

  .modal-veil.is-open { display: flex; }

  .modal {
    background: var(--paper);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 400px;
    padding: 32px 28px 28px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  .modal--processing .spinner {
    width: 48px;
    height: 48px;
    margin: 8px auto 20px;
    border-radius: 50%;
    border: 4px solid var(--line);
    border-top-color: var(--cta);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--cta);
    color: var(--paper);
    display: grid;
    place-items: center;
    margin: 0 auto 14px;
  }

  .check svg { width: 34px; height: 34px; }

  .order-number {
    font-size: 2.1rem;
    color: var(--cta);
    margin: 4px 0 2px;
  }

  .order-number-label {
    font-size: 0.82rem;
    color: var(--ink-faint);
    margin-bottom: 14px;
  }

  .receipt {
    text-align: left;
    background: var(--paper-tint);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin: 14px 0 18px;
  }

  .receipt__row {
    display: flex;
    justify-content: space-between;
    font-size: 0.86rem;
    padding: 4px 0;
    color: var(--ink-soft);
  }

  .receipt__row.total {
    color: var(--ink);
    font-size: 0.98rem;
    padding-top: 8px;
    margin-top: 6px;
    border-top: 1px dashed var(--ink-faint);
  }

  .modal .new-order-btn {
    width: 100%;
    border: none;
    background: var(--ink);
    color: var(--paper);
    padding: 14px;
    border-radius: var(--radius-sm);
    font-size: 1rem;
  }

  .modal .new-order-btn:hover { background: #47392f; }

  .modal p.processing-label {
    color: var(--ink-soft);
    font-size: 0.98rem;
  }

  /* ---------- payment method step ---------- */

  .modal-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -6px -6px 6px;
  }

  .modal-icon-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .modal-icon-btn:hover { background: var(--paper-tint); color: var(--ink); }
  .modal-icon-btn svg { width: 18px; height: 18px; }

  .modal-title {
    font-size: 1.15rem;
    margin: 4px 0 2px;
  }

  .modal-total {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin-bottom: 18px;
  }

  .modal-total b { color: var(--ink); font-weight: 400; }

  .pay-methods {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pay-method-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }

  .pay-method-btn:hover {
    border-color: var(--gold);
    background: var(--gold-soft);
  }

  .pay-method-btn__icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--paper-tint);
    color: var(--ink);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .pay-method-btn__icon svg { width: 24px; height: 24px; }

  .pay-method-btn__text .name { font-size: 1rem; }
  .pay-method-btn__text .hint {
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  /* ---------- cash step ---------- */

  .cash-total {
    background: var(--paper-tint);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 16px;
  }

  .cash-total-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--ink-soft);
    padding: 3px 0;
  }

  .cash-total-row b {
    color: var(--ink);
    font-weight: 400;
    font-size: 1.1rem;
  }

  .cash-total-row.remaining b { color: var(--danger); }
  .cash-total-row.remaining.is-met b { color: var(--cta); }

  .bill-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .bill-btn {
    border: 1.5px dashed var(--line);
    background: var(--paper);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s;
  }

  .bill-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .bill-btn svg { width: 26px; height: 26px; color: var(--toast); }
  .bill-btn span { font-size: 0.92rem; }
  .bill-btn small { font-size: 0.7rem; color: var(--ink-faint); }

  .cash-actions {
    display: flex;
    gap: 10px;
  }

  .cash-actions .ghost-btn {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 0.92rem;
  }

  .cash-actions .ghost-btn:hover { background: var(--paper-tint); }

  /* ---------- qr step ---------- */

  .qr-frame {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px;
    display: inline-grid;
    place-items: center;
    margin: 4px auto 14px;
  }

  .qr-frame img, .qr-frame canvas { display: block; }

  .qr-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }

  .qr-status .dot-spin {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    border-top-color: var(--gold);
    animation: spin 0.8s linear infinite;
  }

  /* ---------- phone confirm view ---------- */

  .phone-card__sub {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 2px 0 4px;
  }

  .phone-card__order-no {
    color: var(--ink-faint);
    font-size: 0.85rem;
    margin-top: 14px;
  }

  /* ---------- responsive: bottom-sheet cart ---------- */

  @media (max-width: 980px) {
    .kiosk__body {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }

    .categories {
      flex-direction: row;
      overflow-x: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
    }

    .cat-btn { flex-shrink: 0; }
    .cat-btn span.cat-label { display: inline; }

    .menu { padding-bottom: 90px; }

    .cart {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 1180px;
      margin: 0 auto;
      border-left: none;
      border-top: 1px solid var(--line);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -12px 30px var(--shadow);
      max-height: 78vh;
      transform: translateY(calc(100% - 62px));
      transition: transform 0.25s ease;
      z-index: 30;
    }

    .cart.is-open { transform: translateY(0); }

    .cart__summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

<script>
(function () {
  "use strict";

  // Works wherever this page is hosted (GitHub Pages included) — the QR
  // simply links back to this same page's own URL, stripped of any query.
  var BASE_URL = window.location.origin + window.location.pathname;
  var kioskRoot = document.getElementById("kiosk-root");
  var phoneRoot = document.getElementById("phone-root");
  var searchParams = new URLSearchParams(window.location.search);

  // A QR code generated on the kiosk links back to this SAME page with
  // ?pay=1, so scanning it opens a self-contained payment-confirmation
  // screen — no server or account needed, the order details travel in
  // the link itself.
  if (searchParams.get("pay") === "1") {
    initPhoneView();
    return;
  }
  kioskRoot.style.display = "contents";

  function initPhoneView() {
    phoneRoot.style.display = "block";
    var total = parseInt(searchParams.get("total"), 10);
    var order = searchParams.get("order");
    var pendingEl = document.getElementById("phone-pending");
    var doneEl = document.getElementById("phone-done");
    var invalidEl = document.getElementById("phone-invalid");

    if (!total || !order) {
      pendingEl.hidden = true;
      invalidEl.hidden = false;
      return;
    }

    document.getElementById("phone-order-no").textContent = "주문번호 " + order;
    document.getElementById("phone-amount").textContent = (total).toLocaleString("ko-KR") + "원";
    document.getElementById("phone-pay-btn").addEventListener("click", function () {
      pendingEl.hidden = true;
      doneEl.hidden = false;
    });
  }

  var MENU = [
    { id: "americano", name: "아메리카노", category: "coffee", icon: "icon-cup-hot", price: 3000, temp: "both", iceSurcharge: 500 },

  var SIZE_UPCHARGE = 700;

  });

  function unitPriceFor(item, opts) {
    var price = item.price;
    if (item.temp === "both" && opts.temp === "ice") price += item.iceSurcharge;
    if (hasSizeOption(item) && opts.size === "L") price += SIZE_UPCHARGE;
    if (isCoffee(item) && opts.shot) price += opts.shot * SHOT_PRICE;
    return price;
  }

  function priceBreakdown(item, opts) {
    var parts = [];
    if (item.temp === "both" && opts.temp === "ice") parts.push("ICE +" + won(item.iceSurcharge));
    if (hasSizeOption(item) && opts.size === "L") parts.push("L +" + won(SIZE_UPCHARGE));
    if (isCoffee(item) && opts.shot) parts.push("샷" + opts.shot + " +" + won(opts.shot * SHOT_PRICE));
    if (isCoffee(item) && opts.decaf) parts.push("디카페인");
    return parts;
  }

  function lineOptions(line) {
    var parts = [];
    var t = tempLabel(line.temp);
    if (t) parts.push(t);
    if (line.size === "L") parts.push("Large");
    if (line.shot) parts.push("샷+" + line.shot);
    if (line.decaf) parts.push("디카페인");
    return parts.join(" · ");
  }

  // ---------- category rail ----------

  var categoriesEl = document.getElementById("categories");
  CATEGORIES.forEach(function (cat) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-btn" + (cat.id === state.category ? " is-active" : "");
    btn.dataset.cat = cat.id;
    btn.innerHTML = '<svg><use href="#' + cat.icon + '"/></svg><span class="cat-label">' + cat.label + "</span>";
    btn.addEventListener("click", function () {
      state.category = cat.id;
      renderCategories();
      renderMenu();
    });
    categoriesEl.appendChild(btn);
  });

  function renderCategories() {
    Array.prototype.forEach.call(categoriesEl.children, function (btn) {
      btn.classList.toggle("is-active", btn.dataset.cat === state.category);
    });
  }

  // ---------- menu grid ----------

  var menuGrid = document.getElementById("menu-grid");
  var menuTitle = document.getElementById("menu-title");
  var menuCount = document.getElementById("menu-count");

  function itemsFor(catId) {
    if (catId === "all") return MENU;
    return MENU.filter(function (m) { return m.category === catId; });
  }

  function renderMenu() {
    var cat = CATEGORIES.filter(function (c) { return c.id === state.category; })[0];
    var items = itemsFor(state.category);
    menuTitle.textContent = cat.label + (cat.id === "all" ? " 메뉴" : "");
    menuCount.textContent = items.length + "종";
    menuGrid.innerHTML = "";

    items.forEach(function (item) {
      var tint = TINT_COLORS[CATEGORY_TINT[item.category]];
      var card = document.createElement("div");
      card.className = "card";

      var tempMarkup;
      if (item.temp === "both") {
        var cur = state.cardTemp[item.id];
        tempMarkup =
          '<div class="temp-toggle" role="group" aria-label="' + item.name + ' 온도 선택">' +
          '<button type="button" data-temp="hot" class="' + (cur === "hot" ? "is-active" : "") + '">HOT</button>' +
          '<button type="button" data-temp="ice" class="' + (cur === "ice" ? "is-active" : "") + '">ICE</button>' +
          "</div>";
      } else if (item.temp === "hot") {
        tempMarkup = '<span class="temp-tag">HOT</span>';
      } else if (item.temp === "ice") {
        tempMarkup = '<span class="temp-tag">ICE</span>';
      } else {
        tempMarkup = "";
      }

      var opts = {
        temp: state.cardTemp[item.id],
        size: state.cardSize[item.id],
        shot: state.cardShot[item.id],
        decaf: state.cardDecaf[item.id]
      };
      var unit = unitPriceFor(item, opts);
      var breakdown = priceBreakdown(item, opts);
      var priceLabel = won(unit) + (breakdown.length ? '<span style="font-size:.72rem;color:var(--ink-faint)"> (' + breakdown.join(" · ") + ")</span>" : "");

      var showOptions = hasSizeOption(item) || isCoffee(item);
      var isOpen = state.cardOptionsOpen[item.id];
      var optionsMarkup = "";
      if (showOptions) {
        var rows = "";
        if (hasSizeOption(item)) {
          rows +=
            '<div class="option-row"><span class="option-row__label">사이즈</span>' +
            '<div class="temp-toggle" role="group" aria-label="' + item.name + ' 사이즈 선택">' +
              '<button type="button" data-size="R" class="' + (opts.size === "R" ? "is-active" : "") + '">보통</button>' +
              '<button type="button" data-size="L" class="' + (opts.size === "L" ? "is-active" : "") + '">큰 사이즈 (+' + SIZE_UPCHARGE.toLocaleString("ko-KR") + "원)</button>" +
            "</div></div>";
        }
        if (isCoffee(item)) {
          rows +=
            '<div class="option-row"><span class="option-row__label">샷 추가 (+' + SHOT_PRICE.toLocaleString("ko-KR") + "원/샷)</span>" +
            '<div class="stepper" aria-label="' + item.name + ' 샷 추가">' +
              '<button type="button" data-act="shot-dec" aria-label="샷 줄이기">−</button>' +
              '<span class="stepper__count num">' + opts.shot + "</span>" +
              '<button type="button" data-act="shot-inc" aria-label="샷 늘리기">+</button>' +
            "</div></div>" +
            '<label class="decaf-chip"><input type="checkbox" data-act="decaf"' + (opts.decaf ? " checked" : "") + "> 디카페인으로 변경</label>";
        }
        optionsMarkup =
          '<button type="button" class="options-toggle" data-act="toggle-options">' + (isOpen ? "옵션 숨기기 ▴" : "세부 옵션 ▾") + "</button>" +
          (isOpen ? '<div class="options-panel">' + rows + "</div>" : "");
      }

      card.innerHTML =
        '<div class="card__top">' +
          '<div class="card__icon" style="background:' + tint.bg + ";color:" + tint.fg + '"><svg><use href="#' + item.icon + '"/></svg></div>' +
          tempMarkup +
        "</div>" +
        '<div class="card__name">' + item.name + "</div>" +
        '<div class="card__price num">' + priceLabel + "</div>" +
        optionsMarkup +
        '<div class="card__bottom">' +
          '<div class="stepper" aria-label="' + item.name + ' 수량">' +
            '<button type="button" data-act="dec" aria-label="수량 줄이기">−</button>' +
            '<span class="stepper__count num">' + state.cardQty[item.id] + "</span>" +
            '<button type="button" data-act="inc" aria-label="수량 늘리기">+</button>' +
          "</div>" +
          '<button type="button" class="add-btn">담기</button>' +
        "</div>";

      card.dataset.id = item.id;
      menuGrid.appendChild(card);
    });
  }

  menuGrid.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    var id = card.dataset.id;
    var item = MENU.filter(function (m) { return m.id === id; })[0];

    if (e.target.closest("[data-temp]")) {
      state.cardTemp[id] = e.target.closest("[data-temp]").dataset.temp;
      renderMenu();
      return;
    }
    if (e.target.closest("[data-size]")) {
      state.cardSize[id] = e.target.closest("[data-size]").dataset.size;
      renderMenu();
      return;
    }
    if (e.target.closest("[data-act='toggle-options']")) {
      state.cardOptionsOpen[id] = !state.cardOptionsOpen[id];
      renderMenu();
      return;
    }
    if (e.target.closest("[data-act='shot-inc']")) {
      state.cardShot[id] = Math.min(MAX_SHOTS, state.cardShot[id] + 1);
      renderMenu();
      return;
    }
    if (e.target.closest("[data-act='shot-dec']")) {
      state.cardShot[id] = Math.max(0, state.cardShot[id] - 1);
      renderMenu();
      return;
    }
    if (e.target.closest("[data-act='inc']")) {
      state.cardQty[id] = Math.min(9, state.cardQty[id] + 1);
      renderMenu();
      return;
    }
    if (e.target.closest("[data-act='dec']")) {
      state.cardQty[id] = Math.max(1, state.cardQty[id] - 1);
      renderMenu();
      return;
    }
    if (e.target.closest(".add-btn")) {
      var opts = {
        temp: state.cardTemp[id],
        size: state.cardSize[id],
        shot: state.cardShot[id],
        decaf: state.cardDecaf[id]
      };
      addToCart(item, opts, state.cardQty[id]);

      var btn = e.target.closest(".add-btn");
      var original = btn.textContent;
      btn.textContent = "담았어요 ✓";
      btn.classList.add("is-added");
      setTimeout(function () {
        btn.textContent = original;
        btn.classList.remove("is-added");
      }, 800);

      // reset this card's quantity in place, without rebuilding the grid,
      // so the "담았어요 ✓" feedback above stays visible
      state.cardQty[id] = 1;
      var countEl = card.querySelector(".card__bottom .stepper__count");
      if (countEl) countEl.textContent = "1";

      bumpCartBadge();
    }
  });

  menuGrid.addEventListener("change", function (e) {
    if (!e.target.matches("[data-act='decaf']")) return;
    var card = e.target.closest(".card");
    if (!card) return;
    state.cardDecaf[card.dataset.id] = e.target.checked;
    renderMenu();
  });

  // ---------- cart ----------

  function addToCart(item, opts, qty) {
    var unitPrice = unitPriceFor(item, opts);
    var key = item.id + ":" + (opts.temp || "none") + ":" + (opts.size || "R") + ":" + (opts.shot || 0) + ":" + (opts.decaf ? "decaf" : "reg");
    var existing = state.cart.filter(function (l) { return l.key === key; })[0];
    if (existing) {
      existing.qty += qty;
    } else {
      state.cart.push({
        key: key,
        id: item.id,
        name: item.name,
        temp: opts.temp,
        size: opts.size,
        shot: opts.shot,
        decaf: opts.decaf,
        unitPrice: unitPrice,
        qty: qty
      });
    }
    renderCart();
  }

  var cartList = document.getElementById("cart-list");
  var cartEmpty = document.getElementById("cart-empty");
  var cartTotalEl = document.getElementById("cart-total");
  var cartItemCountEl = document.getElementById("cart-item-count");
  var payBtn = document.getElementById("pay-btn");
  var barCount = document.getElementById("bar-count");
  var barTotal = document.getElementById("bar-total");
  var cartPanel = document.getElementById("cart");
  var cartToggle = document.getElementById("cart-toggle");

  function cartTotal() {
    return state.cart.reduce(function (sum, l) { return sum + l.unitPrice * l.qty; }, 0);
  }

  function cartCount() {
    return state.cart.reduce(function (sum, l) { return sum + l.qty; }, 0);
  }

  function tempLabel(temp) {
    if (temp === "hot") return "HOT";
    if (temp === "ice") return "ICE";
    return "";
  }

  function renderCart() {
    cartList.querySelectorAll(".line").forEach(function (n) { n.remove(); });
    cartEmpty.style.display = state.cart.length ? "none" : "flex";
    cartEmpty.style.flexDirection = "column";
    cartEmpty.style.alignItems = "center";

    state.cart.forEach(function (line) {
      var el = document.createElement("div");
      el.className = "line";
      el.dataset.key = line.key;
      var metaText = lineOptions(line);
      el.innerHTML =
        '<div class="line__top">' +
          '<div>' +
            '<div class="line__name">' + line.name + "</div>" +
            (metaText ? '<div class="line__meta">' + metaText + "</div>" : "") +
          "</div>" +
          '<button type="button" class="line__remove" aria-label="' + line.name + " 삭제\">×</button>" +
        "</div>" +
        '<div class="line__bottom">' +
          '<div class="stepper" aria-label="' + line.name + ' 수량">' +
            '<button type="button" data-act="dec">−</button>' +
            '<span class="stepper__count num">' + line.qty + "</span>" +
            '<button type="button" data-act="inc">+</button>' +
          "</div>" +
          '<div class="line__price num">' + won(line.unitPrice * line.qty) + "</div>" +
        "</div>";
      cartList.appendChild(el);
    });

    var total = cartTotal();
    var count = cartCount();
    cartTotalEl.textContent = won(total);
    cartItemCountEl.textContent = count + "개";
    barCount.textContent = count;
    barTotal.textContent = won(total);
    payBtn.disabled = state.cart.length === 0;
  }

  cartList.addEventListener("click", function (e) {
    var line = e.target.closest(".line");
    if (!line) return;
    var key = line.dataset.key;
    var entry = state.cart.filter(function (l) { return l.key === key; })[0];
    if (!entry) return;

    if (e.target.closest(".line__remove")) {
      state.cart = state.cart.filter(function (l) { return l.key !== key; });
    } else if (e.target.closest("[data-act='inc']")) {
      entry.qty = Math.min(9, entry.qty + 1);
    } else if (e.target.closest("[data-act='dec']")) {
      entry.qty -= 1;
      if (entry.qty <= 0) {
        state.cart = state.cart.filter(function (l) { return l.key !== key; });
      }
    }
    renderCart();
  });

  function bumpCartBadge() {
    barCount.style.transform = "scale(1.3)";
    setTimeout(function () { barCount.style.transform = "scale(1)"; }, 180);
  }
  barCount.style.transition = "transform 0.18s";

  cartToggle.addEventListener("click", function () {
    cartPanel.classList.toggle("is-open");
  });

  // ---------- order type ----------

  document.querySelectorAll(".order-type button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".order-type button").forEach(function (b) { b.classList.remove("is-active"); });
      btn.classList.add("is-active");
      state.orderType = btn.dataset.order;
    });
  });

  // ---------- receipt choice ----------

  document.querySelectorAll("[data-receipt]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-receipt]").forEach(function (b) { b.classList.remove("is-active"); });
      btn.classList.add("is-active");
      state.receiptChoice = btn.dataset.receipt;
    });
  });

  // ---------- call staff ----------

  var helpBtn = document.getElementById("help-btn");
  var helpToast = document.getElementById("help-toast");
  var helpTimer = null;

  helpBtn.addEventListener("click", function () {
    helpToast.hidden = false;
    requestAnimationFrame(function () { helpToast.classList.add("is-visible"); });
    clearTimeout(helpTimer);
    helpTimer = setTimeout(function () {
      helpToast.classList.remove("is-visible");
      setTimeout(function () { helpToast.hidden = true; }, 250);
    }, 3000);
  });

  // ---------- checkout ----------

  var modalVeil = document.getElementById("modal-veil");
  var modalBody = document.getElementById("modal-body");
  var checkoutOrderNumber = null;
  var checkoutTimer = null;

  function clearCheckoutTimer() {
    if (checkoutTimer) {
      clearTimeout(checkoutTimer);
      checkoutTimer = null;
    }
  }

  function openCheckout() {
    if (!state.cart.length) return;
    checkoutOrderNumber = String(Math.floor(Math.random() * 900) + 100);
    modalVeil.classList.add("is-open");
    showMethodStep();
  }

  function closeCheckout() {
    clearCheckoutTimer();
    modalVeil.classList.remove("is-open");
  }

  function modalTopbar() {
    return '<div class="modal-topbar">' +
      '<button type="button" class="modal-icon-btn" id="modal-back" aria-label="이전 단계">' +
        '<svg><use href="#icon-arrow-left"/></svg>' +
      '</button>' +
      '<button type="button" class="modal-icon-btn" id="modal-close" aria-label="닫기">' +
        '<svg><use href="#icon-x"/></svg>' +
      '</button>' +
    '</div>';
  }

  function bindTopbar(onBack) {
    document.getElementById("modal-close").addEventListener("click", closeCheckout);
    document.getElementById("modal-back").addEventListener("click", onBack || closeCheckout);
  }

  function payMethodBtn(method, icon, name, hint) {
    return '<button type="button" class="pay-method-btn" data-method="' + method + '">' +
      '<span class="pay-method-btn__icon"><svg><use href="#' + icon + '"/></svg></span>' +
      '<span class="pay-method-btn__text"><span class="name">' + name + '</span><span class="hint">' + hint + '</span></span>' +
    '</button>';
  }

  function showMethodStep() {
    clearCheckoutTimer();
    var total = cartTotal();

    modalBody.className = "modal modal--method";
    modalBody.innerHTML =
      modalTopbar() +
      '<div class="modal-title display">결제 수단을 선택해주세요</div>' +
      '<div class="modal-total">결제 금액 <b class="num">' + won(total) + "</b></div>" +
      '<div class="pay-methods">' +
        payMethodBtn("card", "icon-card", "카드", "신용·체크카드로 결제") +
        payMethodBtn("cash", "icon-cash", "현금", "지폐를 넣어서 결제") +
        payMethodBtn("qr", "icon-qr", "간편결제", "QR코드를 휴대폰으로 스캔") +
      "</div>";

    bindTopbar(closeCheckout);
    modalBody.querySelectorAll("[data-method]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var method = btn.dataset.method;
        if (method === "card") showCardStep();
        else if (method === "cash") showCashStep();
        else if (method === "qr") showQrStep();
      });
    });
  }

  function showCardStep() {
    clearCheckoutTimer();
    modalBody.className = "modal modal--processing";
    modalBody.innerHTML = modalTopbar() + '<div class="spinner"></div><p class="processing-label">카드를 인식하고 있어요…</p>';
    bindTopbar(showMethodStep);
    checkoutTimer = setTimeout(function () { finishPayment("카드", {}); }, 1100);
  }

  function showCashStep() {
    clearCheckoutTimer();
    var total = cartTotal();
    var inserted = 0;

    function renderCash() {
      var remaining = Math.max(0, total - inserted);
      var change = Math.max(0, inserted - total);
      var met = inserted >= total;

      modalBody.className = "modal modal--cash";
      modalBody.innerHTML =
        modalTopbar() +
        '<div class="modal-title display">현금 결제</div>' +
        '<div class="cash-total">' +
          '<div class="cash-total-row"><span>결제 금액</span><b class="num">' + won(total) + "</b></div>" +
          '<div class="cash-total-row"><span>투입 금액</span><b class="num">' + won(inserted) + "</b></div>" +
          '<div class="cash-total-row remaining' + (met ? " is-met" : "") + '"><span>' + (met ? "거스름돈" : "남은 금액") + '</span><b class="num">' + won(met ? change : remaining) + "</b></div>" +
        "</div>" +
        '<div class="bill-grid">' +
          [1000, 5000, 10000, 50000].map(function (v) {
            return '<button type="button" class="bill-btn" data-bill="' + v + '"><svg><use href="#icon-cash"/></svg><span class="num">' + v.toLocaleString("ko-KR") + '원</span><small>넣기</small></button>';
          }).join("") +
        "</div>" +
        '<div class="cash-actions">' +
          '<button type="button" class="ghost-btn" id="cash-reset">다시 넣기</button>' +
          '<button type="button" class="pay-btn" id="cash-confirm" style="flex:1"' + (met ? "" : " disabled") + '><svg><use href="#icon-check"/></svg>결제 완료</button>' +
        "</div>";

      bindTopbar(showMethodStep);
      modalBody.querySelectorAll("[data-bill]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          inserted += parseInt(btn.dataset.bill, 10);
          renderCash();
        });
      });
      document.getElementById("cash-reset").addEventListener("click", function () {
        inserted = 0;
        renderCash();
      });
      if (met) {
        document.getElementById("cash-confirm").addEventListener("click", function () {
          finishPayment("현금", { received: inserted, change: change });
        });
      }
    }

    renderCash();
  }

  function showQrStep() {
    clearCheckoutTimer();
    var total = cartTotal();
    var payUrl = BASE_URL + "?pay=1&total=" + total + "&order=" + checkoutOrderNumber;

    modalBody.className = "modal modal--qr";
    modalBody.innerHTML =
      modalTopbar() +
      '<div class="modal-title display">간편결제 (QR)</div>' +
      '<div class="modal-total">결제 금액 <b class="num">' + won(total) + "</b></div>" +
      '<div class="qr-frame" id="qr-frame"></div>' +
      '<div class="qr-status"><span class="dot-spin"></span>휴대폰으로 QR코드를 비춰 결제해보세요</div>' +
      '<button type="button" class="pay-btn" id="qr-confirm" style="width:100%"><svg><use href="#icon-check"/></svg>결제 완료 확인</button>';

    bindTopbar(showMethodStep);

    var qrFrame = document.getElementById("qr-frame");
    try {
      if (typeof QRCode !== "undefined") {
        new QRCode(qrFrame, {
          text: payUrl,
          width: 168,
          height: 168,
          colorDark: "#2b2420",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrFrame.textContent = "QR코드를 불러올 수 없어요";
      }
    } catch (err) {
      qrFrame.textContent = "QR코드를 불러올 수 없어요";
    }

    document.getElementById("qr-confirm").addEventListener("click", function () {
      finishPayment("간편결제(QR)", {});
    });

    // Kiosks don't wait forever on a simple-pay tap — auto-continue after
    // a few seconds, same as tapping the confirm button.
    checkoutTimer = setTimeout(function () { finishPayment("간편결제(QR)", {}); }, 6000);
  }

  function finishPayment(methodLabel, extra) {
    clearCheckoutTimer();
    var receiptLines = state.cart.map(function (l) {
      return { name: l.name, temp: l.temp, size: l.size, shot: l.shot, decaf: l.decaf, qty: l.qty, sum: l.unitPrice * l.qty };
    });
    var total = cartTotal();
    var orderTypeLabel = state.orderType === "dine" ? "매장" : "포장";
    var wantsReceipt = state.receiptChoice !== "no";

    modalBody.className = "modal modal--success";

    var receiptBlock;
    if (wantsReceipt) {
      var rows = receiptLines.map(function (l) {
        var opts = lineOptions(l);
        return '<div class="receipt__row"><span>' + l.name + (opts ? " (" + opts + ")" : "") + " ×" + l.qty + '</span><span class="num">' + won(l.sum) + "</span></div>";
      }).join("");

      var extraRows = "";
      if (extra && typeof extra.received === "number") {
        extraRows =
          '<div class="receipt__row"><span>받은 금액</span><span class="num">' + won(extra.received) + "</span></div>" +
          '<div class="receipt__row"><span>거스름돈</span><span class="num">' + won(extra.change) + "</span></div>";
      }

      receiptBlock = '<div class="receipt">' + rows + extraRows + '<div class="receipt__row total"><span>총 결제금액</span><span class="num">' + won(total) + "</span></div></div>";
    } else {
      receiptBlock =
        '<div class="modal-total" style="margin-bottom:14px">결제 총액 <b class="num">' + won(total) + "</b></div>" +
        '<div class="receipt" style="text-align:center;color:var(--ink-soft)">영수증을 받지 않도록 선택하셨어요.</div>';
    }

    modalBody.innerHTML =
      '<div class="check"><svg><use href="#icon-check"/></svg></div>' +
      '<div class="display">결제가 완료되었습니다</div>' +
      '<div class="order-number display num">' + checkoutOrderNumber + "</div>" +
      '<div class="order-number-label">주문번호 · ' + orderTypeLabel + " · " + methodLabel + "</div>" +
      receiptBlock +
      '<button type="button" class="new-order-btn" id="new-order-btn">확인</button>';

    document.getElementById("new-order-btn").addEventListener("click", showPreparingStep);
  }

  function showPreparingStep() {
    clearCheckoutTimer();
    modalBody.className = "modal modal--processing";
    modalBody.innerHTML = '<div class="spinner"></div><p class="processing-label">음료·메뉴를 준비하고 있어요…</p>';
    checkoutTimer = setTimeout(showReadyStep, 3200);
  }

  function showReadyStep() {
    clearCheckoutTimer();
    modalBody.className = "modal modal--success";
    modalBody.innerHTML =
      '<div class="check"><svg><use href="#icon-check"/></svg></div>' +
      '<div class="display">준비가 완료됐어요!</div>' +
      '<div class="order-number display num">' + checkoutOrderNumber + "</div>" +
      '<div class="order-number-label">픽업대에서 주문번호를 확인해주세요</div>' +
      '<button type="button" class="new-order-btn" id="new-order-btn">새 주문 시작하기</button>';

    document.getElementById("new-order-btn").addEventListener("click", function () {
      state.cart = [];
      renderCart();
      cartPanel.classList.remove("is-open");
      modalVeil.classList.remove("is-open");
    });
  }

  payBtn.addEventListener("click", openCheckout);

  // ---------- init ----------

  renderMenu();
  renderCart();
})();
</script>
